<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ConsolePR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span id="search-icon" data-icon="search"></span>
    <input id="search" type="text" spellcheck="false" autocomplete="off" placeholder="Buscar efeito..." data-i18n-placeholder="search.placeholder" autofocus>
    <span id="settings-title" data-i18n="settings.title" hidden>Configurações</span>
    <button id="keys-button" type="button" title="Suavização de keyframes" aria-label="Suavização de keyframes" data-i18n-title="keys.button" data-icon="keyframe"></button>
    <button id="frame-button" type="button" title="Print do frame atual" aria-label="Print do frame atual" data-i18n-title="frame.title" aria-haspopup="menu" aria-expanded="false" data-icon="camera"></button>
    <button id="settings-button" type="button" title="Configurações" aria-label="Configurações" data-i18n-title="settings.title" data-icon="gear"></button>
    <div id="frame-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-frame="clipboard"><span data-icon="clipboard"></span><span data-i18n="frame.clipboard">Copiar para a área de transferência</span></button>
      <button type="button" role="menuitem" data-frame="png"><span data-icon="picture"></span><span data-i18n="frame.png">Salvar como PNG</span></button>
      <button type="button" role="menuitem" data-frame="jpeg"><span data-icon="picture"></span><span data-i18n="frame.jpeg">Salvar como JPEG</span></button>
    </div>
  </header>
  <main id="list" role="listbox"></main>
  <section id="settings" hidden>
    <label for="hotkey-field" data-i18n="hotkey.label">Atalho para abrir o ConsolePR</label>
    <button id="hotkey-field" type="button"></button>
    <p id="hotkey-message" role="status"></p>
    <p class="hint" data-i18n="hotkey.hint">Clique no campo e pressione a combinação: Ctrl ou Alt com letra, número ou Espaço, ou uma tecla F. Com o programa em foco, ela tem prioridade sobre comandos iguais dele.</p>
    <button id="hotkey-default" type="button"></button>
    <div id="accent-control">
      <label for="accent-hex" data-i18n="accent.label">Cor de destaque</label>
      <div id="accent-row">
        <button id="accent-swatch" type="button" title="Abrir seletor de cores" aria-label="Abrir seletor de cores" data-i18n-title="accent.open" aria-expanded="false"></button>
        <input id="accent-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="accent-message">
        <button id="accent-default" type="button" data-i18n="accent.default">Padrão</button>
      </div>
      <p id="accent-message" role="status" hidden></p>
      <div id="accent-picker" hidden>
        <div id="accent-sv" role="application" aria-label="Saturação e brilho" data-i18n-aria="accent.sv"><div id="accent-sv-thumb"></div></div>
        <input id="accent-hue" type="range" min="0" max="360" step="1" aria-label="Matiz" data-i18n-aria="accent.hue">
      </div>
    </div>
    <p class="credit"><span data-i18n="credit.by">Feito por</span> <a id="credit-link" href="https://www.instagram.com/kievydsg/">@kievydsg</a></p>
  </section>
  <section id="keys" hidden>
    <div class="ease-row">
      <span data-icon="easeIn" title="Entrada: suavização na chegada aos keyframes selecionados" data-i18n-title="keys.easeIn"></span>
      <input id="ease-in" type="range" min="0" max="100" step="1" aria-label="Suavização de entrada" data-i18n-aria="keys.easeIn">
      <input id="ease-in-value" class="ease-value" type="number" min="0" max="100" aria-label="Valor da entrada" data-i18n-aria="keys.easeInValue">
      <button type="button" class="interp-button" data-interp="hold" data-icon="hold" title="Clique: muda a interpolação dos keyframes selecionados para HOLD&#10;Alt+Clique: muda só a entrada (IN) para HOLD, segurando o valor até o keyframe&#10;Shift+Clique: muda só a saída (OUT) para HOLD" aria-label="Interpolação HOLD" data-i18n-title="keys.hold" data-i18n-aria="keys.holdName"></button>
    </div>
    <div class="ease-row">
      <span data-icon="easeOut" title="Saída: suavização na partida dos keyframes selecionados" data-i18n-title="keys.easeOut"></span>
      <input id="ease-out" type="range" min="0" max="100" step="1" aria-label="Suavização de saída" data-i18n-aria="keys.easeOut">
      <input id="ease-out-value" class="ease-value" type="number" min="0" max="100" aria-label="Valor da saída" data-i18n-aria="keys.easeOutValue">
      <button type="button" class="interp-button" data-interp="linear" data-icon="linear" title="Clique: muda a interpolação dos keyframes selecionados para LINEAR&#10;Alt+Clique: muda só a entrada (IN) para LINEAR&#10;Shift+Clique: muda só a saída (OUT) para LINEAR" aria-label="Interpolação LINEAR" data-i18n-title="keys.linear" data-i18n-aria="keys.linearName"></button>
    </div>
    <div class="ease-row">
      <span data-icon="easeBoth" title="Entrada e saída juntas" data-i18n-title="keys.easeBoth"></span>
      <input id="ease-both" type="range" min="0" max="100" step="1" aria-label="Suavização de entrada e saída" data-i18n-aria="keys.easeBoth">
      <input id="ease-both-value" class="ease-value" type="number" min="0" max="100" aria-label="Valor de entrada e saída" data-i18n-aria="keys.easeBothValue">
      <button type="button" class="interp-button" data-interp="bezier" data-icon="bezier" title="Clique: muda a interpolação dos keyframes selecionados para BEZIER&#10;Alt+Clique: muda só a entrada (IN) para BEZIER&#10;Shift+Clique: muda só a saída (OUT) para BEZIER" aria-label="Interpolação BEZIER" data-i18n-title="keys.bezier" data-i18n-aria="keys.bezierName"></button>
    </div>
    <div id="ease-preview" aria-hidden="true">
      <svg id="ease-graph" viewBox="-6 -6 112 112"><path class="ease-axis" d="M0 0 V100 H100"></path><path id="ease-curve" d=""></path></svg>
      <div id="ease-track"><div id="ease-dot"></div></div>
    </div>
    <p id="keys-hint" data-i18n="keys.hint">Selecione keyframes na timeline. Os sliders aplicam ao soltar.</p>
  </section>
  <footer id="status" hidden></footer>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="search.js"></script>
  <script src="hotkey.js"></script>
  <script src="color.js"></script>
  <script src="frame.js"></script>
  <script src="keyframes.js"></script>
  <script src="palette.js"></script>
</body>
</html>
