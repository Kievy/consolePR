<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ConsolePR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span id="search-icon" data-icon="search"></span>
    <input id="search" type="text" spellcheck="false" autocomplete="off" placeholder="Buscar efeito..." autofocus>
    <span id="settings-title" hidden>Configurações</span>
    <button id="settings-button" type="button" title="Configurações" aria-label="Configurações" data-icon="gear"></button>
  </header>
  <main id="list" role="listbox"></main>
  <section id="settings" hidden>
    <label for="hotkey-field">Atalho para abrir o ConsolePR</label>
    <button id="hotkey-field" type="button"></button>
    <p id="hotkey-message" role="status"></p>
    <p class="hint">Clique no campo e pressione a combinação: Ctrl ou Alt com letra, número ou Espaço, ou uma tecla F. Com o Premiere em foco, ela tem prioridade sobre comandos iguais dele.</p>
    <button id="hotkey-default" type="button">Restaurar padrão (Ctrl + Espaço)</button>
    <div id="accent-control">
      <label for="accent-hex">Cor de destaque</label>
      <div id="accent-row">
        <button id="accent-swatch" type="button" title="Abrir seletor de cores" aria-label="Abrir seletor de cores" aria-expanded="false"></button>
        <input id="accent-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="accent-message">
        <button id="accent-default" type="button">Padrão</button>
      </div>
      <p id="accent-message" role="status" hidden></p>
      <div id="accent-picker" hidden>
        <div id="accent-sv" role="application" aria-label="Saturação e brilho"><div id="accent-sv-thumb"></div></div>
        <input id="accent-hue" type="range" min="0" max="360" step="1" aria-label="Matiz">
      </div>
    </div>
    <p class="credit">Feito por <a id="credit-link" href="https://www.instagram.com/kievydsg/">@kievydsg</a></p>
  </section>
  <footer id="status" hidden></footer>
  <script src="icons.js"></script>
  <script src="search.js"></script>
  <script src="hotkey.js"></script>
  <script src="color.js"></script>
  <script src="palette.js"></script>
</body>
</html>
